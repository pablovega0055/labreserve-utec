spring.application.name=examen-dbp

# Lee el archivo .env de la carpeta raiz del proyecto (si no existe, usa los valores por defecto de abajo)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ===== Base de datos (PostgreSQL en Docker) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:examen_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== JPA / Hibernate =====
# update = crea/actualiza tablas solo. Si el examen pide borrar todo al iniciar: create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Errores legibles en las respuestas =====
server.error.include-message=always

# ===== Actuator: GET /actuator/health =====
management.endpoints.web.exposure.include=health

# ===== JWT =====
jwt.secret=${JWT_SECRET:bGFicmVzZXJ2ZS11dGVjLXNlY3JldC1rZXktY3MyMDMxLWRicC0yMDI2}
jwt.expiration-access=${JWT_EXPIRATION:3600000}
